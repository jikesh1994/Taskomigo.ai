[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent-backend"
version = "0.1.0"
description = "Taskomigo (AI job application agent) - backend API and workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=42",
    "structlog>=24.1",
    "tzdata>=2024.1",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Pick the extras for the providers/backends you configure (the Docker image installs all).
anthropic = ["anthropic>=1.9,<2"]
openai = ["openai>=3.0,<4"]
s3 = ["boto3>=1.34"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "fakeredis>=2.23",
    "ruff>=0.5",
    "fpdf2>=2.7",
    "moto[s3]>=5.0",
    "anthropic>=1.9,<2",
    "openai>=3.0,<4",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ai.prompts" = ["*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires a real PostgreSQL database (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ASYNC240"]
"alembic/**" = ["E501"]
# Regex and vocabulary tables read better unwrapped; en dashes are intentional there.
"app/jobs/extract.py" = ["E501", "RUF001"]
"app/jobs/skills_vocab.py" = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
